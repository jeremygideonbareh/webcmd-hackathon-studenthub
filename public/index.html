<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas — Student Hub</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">A</span>
        <span class="brand-name">Atlas</span>
        <span class="brand-tag">student hub</span>
      </div>
      <div class="topbar-meta">
        <span id="last-updated" class="muted">—</span>
        <button id="refresh-btn" class="btn-ghost" title="Refresh">↻ refresh</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- GPA strip -->
    <section id="gpa-section" class="gpa-strip hidden"></section>

    <!-- Attendance -->
    <section class="section">
      <h2 class="section-title">Attendance Risk</h2>
      <div id="attendance-grid" class="grid attendance-grid"></div>
    </section>

    <!-- Jobs -->
    <section class="section">
      <h2 class="section-title">Internships for You</h2>
      <div id="jobs-list" class="jobs-list"></div>
    </section>

    <!-- Housing -->
    <section class="section">
      <h2 class="section-title">Housing Near Campus</h2>
      <div id="housing-grid" class="grid housing-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Atlas · learns from your reactions</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
